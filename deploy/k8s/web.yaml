apiVersion: apps/v1
kind: Deployment
metadata:
  name: reportly-web
  namespace: reportly
  labels:
    app.kubernetes.io/name: reportly
    app.kubernetes.io/component: web
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: reportly
      app.kubernetes.io/component: web
  template:
    metadata:
      labels:
        app.kubernetes.io/name: reportly
        app.kubernetes.io/component: web
    spec:
      # uid 101 is the nginx user in the unprivileged image, which is why the
      # container listens on 8080 — nothing here may bind a privileged port.
      securityContext:
        runAsNonRoot: true
        runAsUser: 101
        fsGroup: 101
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: web
          image: reportly/web:latest
          ports:
            - containerPort: 8080
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          # The unprivileged image keeps its pid file and every *_temp_path under
          # /tmp (not /var/cache/nginx — checked in the image's nginx.conf), so /tmp
          # is the one path a read-only root filesystem has to hand back. Without it
          # nginx exits at startup with "mkdir /tmp/proxy_temp failed".
          volumeMounts:
            - name: tmp
              mountPath: /tmp
          livenessProbe:
            httpGet:
              path: /
              port: 8080
            periodSeconds: 15
          readinessProbe:
            httpGet:
              path: /
              port: 8080
            periodSeconds: 10
          startupProbe:
            httpGet:
              path: /
              port: 8080
            periodSeconds: 3
            failureThreshold: 10
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 128Mi
      volumes:
        - name: tmp
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: reportly-web
  namespace: reportly
  labels:
    app.kubernetes.io/name: reportly
    app.kubernetes.io/component: web
spec:
  selector:
    app.kubernetes.io/name: reportly
    app.kubernetes.io/component: web
  ports:
    - port: 80
      targetPort: 8080

# Author: Brijesh Dave <https://github.com/brijeshdave>
# Serves the built SPA and proxies /api to the API service. The upstream host
# `api` is resolved by Docker Compose / Kubernetes service DNS.
#
# Serving both from one origin is not merely tidy: it is what makes the session
# cookie's SameSite=Lax an actual CSRF defence. A cross-site request cannot carry
# the cookie, and no second origin legitimately needs it.
#
# Port 8080, not 80: the image runs as a non-root user, which cannot bind a
# privileged port.
server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    include /etc/nginx/conf.d/security-headers.conf;

    location /api/ {
        # The API answers with its own headers (helmet); don't restate them here.
        proxy_pass http://api:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Asset filenames carry a content hash, so they can be cached indefinitely.
    # `expires` would emit a second, conflicting Cache-Control of its own, so the
    # header is set once, here.
    location /assets/ {
        include /etc/nginx/conf.d/security-headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
    }

    # index.html must never be cached, or a browser keeps booting the previous
    # deploy's bundle from a filename that no longer exists.
    location / {
        include /etc/nginx/conf.d/security-headers.conf;
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache" always;
    }
}

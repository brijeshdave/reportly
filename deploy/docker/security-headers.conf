# Author: Brijesh Dave <https://github.com/brijeshdave>
# Security headers for everything nginx serves itself (the HTML and the bundle).
# The API sets its own via helmet; nothing set these, and they cover the part a
# browser actually renders.
#
# This is a separate file because of an nginx rule that is easy to lose an
# afternoon to: `add_header` directives are inherited from the enclosing block
# ONLY when the current block declares none of its own. A `location` that adds a
# single Cache-Control therefore drops every security header above it, silently.
# So each location includes this rather than relying on inheritance.
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "no-referrer" always;

# The app frames nothing, is framed by nobody, and loads nothing cross-origin.
# `script-src 'self'` holds because Vite emits content-hashed files and the theme
# bootstrap is a file rather than an inline script (apps/web/public/theme-init.js).
# `style-src` must allow inline: the CSS-variable theme is applied as a style
# attribute on the root element.
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self' data:; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none'" always;

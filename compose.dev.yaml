# Development infrastructure: Postgres (app + log DB), Redis, Mailpit.
# App services run on the host via `pnpm dev`. Copy .env.example to .env first.
name: reportly

services:
  postgres:
    # Matches production and CI. An existing volume created by Postgres 16 will
    # NOT start under 18 — Postgres refuses to open a data directory from an
    # older major rather than risking it, so this fails loudly and safely. To
    # move an existing development database across:
    #
    #   docker compose exec postgres pg_dumpall -U reportly > dev-dump.sql
    #   docker compose down && docker volume rm reportly_postgres-data
    #   docker compose up -d postgres
    #   docker compose exec -T postgres psql -U reportly < dev-dump.sql
    #
    # Or, if the data is throwaway, drop the volume and re-run migrate + seed.
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-reportly}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-reportly}
      POSTGRES_DB: ${POSTGRES_DB:-reportly}
      POSTGRES_LOG_DB: ${POSTGRES_LOG_DB:-reportly_logs}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      # /var/lib/postgresql, NOT /var/lib/postgresql/data. Postgres 18's image
      # changed where it keeps data: it now uses a major-version subdirectory
      # (/var/lib/postgresql/18/docker) so that pg_upgrade --link can work without
      # crossing a mount boundary. Mounting the old path leaves the volume unused
      # — the container starts, initialises inside its own filesystem, and every
      # byte is lost on the next recreate.
      - postgres-data:/var/lib/postgresql
      - ./deploy/docker/init-multiple-dbs.sh:/docker-entrypoint-initdb.d/init-multiple-dbs.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-reportly}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:8-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  mailpit:
    image: axllent/mailpit:latest
    restart: unless-stopped
    ports:
      - "${MAILPIT_SMTP_PORT:-1025}:1025"
      - "${MAILPIT_UI_PORT:-8025}:8025"

volumes:
  postgres-data:
  redis-data:

# Development infrastructure: Postgres (app + log DB), Redis, Mailpit.
# App services run on the host via `pnpm dev`. Copy .env.example to .env first.
name: ${PROJECT_NAME:-reportly-dev}

services:
  postgres:
    # Matches production and CI. An existing volume created by Postgres 16 will
    # NOT start under 18 — Postgres refuses to open a data directory from an
    # older major rather than risking it, so this fails loudly and safely. To
    # move an existing development database across:
    #
    #   docker compose exec postgres pg_dumpall -U reportly > dev-dump.sql
    #   docker compose down && docker volume rm reportly_postgres-data
    #   docker compose up -d postgres
    #   docker compose exec -T postgres psql -U reportly < dev-dump.sql
    #
    # Or, if the data is throwaway, drop the volume and re-run migrate + seed.
    image: postgres:18-alpine
    hostname: ${PROJECT_NAME:-reportly}-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-reportly}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-reportly}
      POSTGRES_DB: ${POSTGRES_DB:-reportly}
      POSTGRES_LOG_DB: ${POSTGRES_LOG_DB:-reportly_logs}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      # /var/lib/postgresql, NOT /var/lib/postgresql/data. Postgres 18's image
      # changed where it keeps data: it now uses a major-version subdirectory
      # (/var/lib/postgresql/18/docker) so that pg_upgrade --link can work without
      # crossing a mount boundary. Mounting the old path leaves the volume unused
      # — the container starts, initialises inside its own filesystem, and every
      # byte is lost on the next recreate.
      # Bind mounted: run `scripts/data-dirs.sh` before the first `up`. It
      # creates this owned by uid 70, which is what this image runs as — a folder
      # owned by you makes Postgres refuse to start.
      - ./data/postgres:/var/lib/postgresql
      # A named volume instead, if you would rather Docker owned it:
      # - postgres-data:/var/lib/postgresql
      - ./deploy/docker/init-multiple-dbs.sh:/docker-entrypoint-initdb.d/init-multiple-dbs.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-reportly}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:8-alpine
    hostname: ${PROJECT_NAME:-reportly}-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      # scripts/data-dirs.sh creates this owned by uid 999.
      - ./data/redis:/data
      # A named volume instead:
      # - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  mailpit:
    image: axllent/mailpit:latest
    hostname: ${PROJECT_NAME:-reportly}-mailpit
    restart: unless-stopped
    ports:
      - "${MAILPIT_SMTP_PORT:-1025}:1025"
      - "${MAILPIT_UI_PORT:-8025}:8025"

# Data lives in ./data, bind mounted, so you can see it. **Run
# `scripts/data-dirs.sh` before the first `up`** — it creates the tree owned by
# the uid each container runs as, and without it Postgres will not start.
#
# The named volumes below stay declared so the commented alternatives above work
# by uncommenting one line; an unused named volume costs nothing.
#
# There is no api service here: development runs it on the host, so its uploads,
# logs and backups already land on your disk at the paths in apps/api/.env
# (STORAGE_LOCAL_DIR, LOG_DIR). Point those at ./data/api/uploads and
# ./data/api/logs to match the layout the script builds.
volumes:
  postgres-data:
  redis-data:

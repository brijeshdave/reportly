name: Bug report
description: Something does not work the way it should.
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Not a bug but a security vulnerability? Do not file it here — see
        [SECURITY.md](../blob/main/SECURITY.md).

  - type: input
    id: version
    attributes:
      label: Version or commit
      placeholder: v0.1.0, or the commit SHA
    validations:
      required: true

  - type: dropdown
    id: deployment
    attributes:
      label: How are you running it?
      options:
        - Development (pnpm dev)
        - Docker Compose (production)
        - Kubernetes
        - Bare Node
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: What did you expect to happen?
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: What happened instead?
    validations:
      required: true

  - type: textarea
    id: reproduce
    attributes:
      label: How can we reproduce it?
      description: Steps, starting from a fresh install where possible.
      placeholder: |
        1. Sign in as a Manager
        2. Open Groups -> Engineering -> Members
        3. ...
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Relevant logs
      description: >
        Turn on Settings -> Debug, reproduce, then copy the lines from
        Logs -> Search. Include the request id if you have one.
        Redact anything sensitive.
      render: shell

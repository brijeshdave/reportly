name: Feature request
description: Suggest something Reportly should do.
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem are you trying to solve?
      description: >
        Describe the situation you are in, not the feature you have in mind.
        The best solution is often not the first one proposed.
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: What would you like Reportly to do?
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: What have you tried, or considered?

  - type: dropdown
    id: who
    attributes:
      label: Who is this for?
      options:
        - Everyone
        - Administrators
        - Operators running the deployment
        - Developers building on Reportly
    validations:
      required: true

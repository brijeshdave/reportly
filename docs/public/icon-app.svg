<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!-- The large cut: a bound logbook with a ribbon at the open page. Used where the
       icon is seen big — home screens, install prompts, the documentation nav. -->
  <defs>
    <linearGradient id="rg-app" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" style="stop-color:var(--brand-from, #6366f1)"/>
      <stop offset="1" style="stop-color:var(--brand-to, #a855f7)"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" rx="116" fill="url(#rg-app)"/>
  <rect x="96" y="88" width="320" height="336" rx="36" fill="none" stroke="#ffffff" stroke-width="28"/>
  <line x1="168" y1="88" x2="168" y2="424" stroke="#ffffff" stroke-width="28"/>
  <path d="M296 88 h64 v212 l-32 -30 -32 30 z" fill="#ffffff"/>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!-- The browser draws an SVG favicon at 16-32px, so this is the solid cut of the
       mark: the outline version loses its spine and ribbon at that size. The large
       artwork lives in icon-app.svg and the PNGs. -->
  <defs>
    <linearGradient id="rg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#6366f1"/>
      <stop offset="1" stop-color="#a855f7"/>
    </linearGradient>
    <mask id="rm">
      <rect width="512" height="512" fill="#000"/>
      <rect x="96" y="88" width="320" height="336" rx="40" fill="#fff"/>
      <rect x="150" y="88" width="36" height="336" fill="#000"/>
      <path d="M288 88 h76 v168 l-38 -34 -38 34 z" fill="#000"/>
    </mask>
  </defs>
  <rect width="512" height="512" rx="116" fill="url(#rg)"/>
  <rect width="512" height="512" fill="#ffffff" mask="url(#rm)"/>
</svg>
